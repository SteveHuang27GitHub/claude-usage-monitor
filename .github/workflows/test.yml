name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: bash tests/run.sh
      - name: install / uninstall round-trip
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          echo '{"statusLine":{"type":"command","command":"printf ORIG"}}' > "$CLAUDE_CONFIG_DIR/settings.json"
          bash install.sh --no-timer
          grep -q usage-statusline.js "$CLAUDE_CONFIG_DIR/settings.json"
          grep -q '"inner_statusline": "printf ORIG"' "$CLAUDE_CONFIG_DIR/usage-monitor.json"
          echo '{"rate_limits":{"five_hour":{"used_percentage":42,"resets_at":9999999999}}}' | node "$CLAUDE_CONFIG_DIR/usage-monitor/usage-statusline.js" | grep -q 'ORIG.*42%'
          bash uninstall.sh
          grep -q '"command": "printf ORIG"' "$CLAUDE_CONFIG_DIR/settings.json"
          ! grep -q usage-guard "$CLAUDE_CONFIG_DIR/settings.json"
